<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Met Gallery · Pinturas Europeas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23070707'/%3E%3Crect x='5' y='5' width='14' height='14' rx='2' fill='none' stroke='%23c9a86a' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;
  --ink:#f4f1ea;
  --dim:rgba(244,241,234,.66);
  --faint:rgba(244,241,234,.42);
  --gold:#c9a86a;
  --line:rgba(255,255,255,.12);
  --glass:rgba(14,14,14,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
body.idle{cursor:none}
button{font-family:inherit}

/* ---------- diapositivas ---------- */
.slide{position:fixed;inset:0;opacity:0;transition:opacity 1.5s ease;will-change:opacity}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform}
body.fit-cover .slide img{object-fit:cover}
.kb0{animation:kb0 linear forwards}
.kb1{animation:kb1 linear forwards}
.kb2{animation:kb2 linear forwards}
.kb3{animation:kb3 linear forwards}
@keyframes kb0{from{transform:scale(1.02)}to{transform:scale(1.09) translate(1.4%,-1%)}}
@keyframes kb1{from{transform:scale(1.02)}to{transform:scale(1.09) translate(-1.4%,1%)}}
@keyframes kb2{from{transform:scale(1.09) translate(1.2%,0)}to{transform:scale(1.02)}}
@keyframes kb3{from{transform:scale(1.09) translate(0,1.2%)}to{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){.slide img{animation:none!important}}

/* ---------- caption ---------- */
#scrim{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:linear-gradient(to top,rgba(0,0,0,.66),rgba(0,0,0,.3) 26%,transparent 56%)}
#scrim.show{opacity:1}
#caption{position:fixed;left:clamp(20px,4vw,56px);bottom:clamp(20px,5vh,52px);
  max-width:min(46ch,82vw);opacity:0;transform:translateY(12px);
  transition:opacity .7s ease,transform .7s ease;pointer-events:none}
#caption.show,#caption.locked{opacity:1;transform:none}
#caption.show .c-link,#caption.locked .c-link{pointer-events:auto}
.c-title{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:500;
  font-size:clamp(24px,3.2vw,44px);line-height:1.12;
  display:-webkit-box;-webkit-line-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
  text-shadow:0 1px 26px rgba(0,0,0,.75)}
.c-meta{margin-top:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.c-meta .date{color:var(--faint);margin-left:10px;letter-spacing:.12em}
.c-sub{margin-top:6px;font-size:12.5px;color:var(--faint)}
.c-link{display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  font-size:12px;letter-spacing:.08em;color:var(--gold);text-decoration:none;
  border-bottom:1px solid rgba(201,168,106,.35);padding-bottom:2px}
.c-link:hover{border-color:var(--gold)}
.c-link svg{width:11px;height:11px}

/* ---------- controles ---------- */
#controls{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;padding:7px;z-index:10;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:opacity .45s ease,transform .45s ease}
body.idle #controls{opacity:0;transform:translate(-50%,12px);pointer-events:none}
#controls button{appearance:none;border:0;background:transparent;color:var(--ink);
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  transition:background .2s,color .2s}
#controls button:hover{background:rgba(255,255,255,.09)}
#controls button.active{color:var(--gold)}
#controls svg{width:19px;height:19px}
.ctl-div{width:1px;height:20px;background:var(--line);margin:0 5px}

/* ---------- ajustes ---------- */
#settings{position:fixed;left:50%;bottom:92px;transform:translate(-50%,8px);
  width:min(340px,calc(100vw - 32px));z-index:11;
  background:var(--glass);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:20px 22px;opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease}
#settings.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.set-row{margin-bottom:16px}
.set-row:last-child{margin-bottom:0}
.set-label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.set-label b{color:var(--ink);font-weight:600;letter-spacing:.06em}
.seg{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);
  font-size:12.5px;font-weight:500;padding:7px 4px;border-radius:7px;cursor:pointer;
  transition:background .2s,color .2s}
.seg button.on{background:rgba(255,255,255,.13);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}

/* ---------- progreso / avisos / cargador ---------- */
#progress{position:fixed;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.07);
  z-index:9;transition:opacity .5s}
body.idle #progress{opacity:0}
#progress i{display:block;height:100%;width:0;background:var(--gold)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,6px);z-index:12;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(14px);padding:10px 18px;font-size:13px;color:var(--dim);
  opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;top:22px;right:26px;z-index:8;font-size:11.5px;letter-spacing:.05em;
  color:var(--faint);opacity:0;transition:opacity .6s;pointer-events:none}
#hint.show{opacity:1}
#hint b{color:var(--dim);font-weight:600}
#loader{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;
  gap:14px;background:var(--bg);transition:opacity .9s ease}
#loader.off{opacity:0;pointer-events:none}
.l-museum{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint)}
.l-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(30px,5vw,52px);font-weight:500}
.l-spin{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.14);
  border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.l-status{font-size:12px;color:var(--faint);text-align:center;max-width:60ch}
@media (max-width:640px){#caption{bottom:96px}}
</style>
</head>
<body>

<div class="slide" id="s0"></div>
<div class="slide" id="s1"></div>
<div id="scrim"></div>

<div id="caption">
  <div class="c-title"></div>
  <div class="c-meta"><span class="c-artist"></span><span class="date"></span></div>
  <div class="c-sub"></div>
  <a class="c-link" target="_blank" rel="noopener">Ver en el Met
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
  </a>
</div>

<div id="hint">Doble clic o <b>F</b> pantalla completa &nbsp;·&nbsp; <b>←</b><b>→</b> cambiar obra &nbsp;·&nbsp; <b>Espacio</b> pausa</div>

<div id="controls">
  <button id="bPrev" title="Obra anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button>
  <button id="bPlay" title="Pausar"></button>
  <button id="bNext" title="Obra siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg></button>
  <span class="ctl-div"></span>
  <button id="bInfo" title="Ficha de la obra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".7" fill="currentColor" stroke="none"/></svg></button>
  <button id="bSettings" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></svg></button>
  <button id="bFull" title="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="settings">
  <div class="set-row">
    <div class="set-label"><span>Duración por obra</span><b id="durVal">30 s</b></div>
    <input type="range" id="dur" min="5" max="120" step="5" value="30">
  </div>
  <div class="set-row">
    <div class="set-label"><span>Calidad de imagen</span></div>
    <div class="seg" id="segQ">
      <button data-v="original">Original</button>
      <button data-v="web">Web · rápida</button>
    </div>
  </div>
  <div class="set-row">
    <div class="set-label"><span>Encuadre</span></div>
    <div class="seg" id="segF">
      <button data-v="contain">Obra completa</button>
      <button data-v="cover">Llenar pantalla</button>
    </div>
  </div>
  <div class="set-row">
    <div class="set-label"><span>Colección</span></div>
    <div class="seg" id="segS">
      <button data-v="all">Toda la colección</button>
      <button data-v="highlight">Destacadas</button>
    </div>
  </div>
</div>

<div id="progress"><i></i></div>
<div id="toast"></div>

<div id="loader">
  <div class="l-museum">The Metropolitan Museum of Art</div>
  <div class="l-title">Pinturas Europeas</div>
  <div class="l-spin"></div>
  <div class="l-status" id="lStatus">Conectando con la colección…</div>
</div>

<script>
'use strict';
/* ================= estado ================= */
const API11 = 'https://collectionapi.metmuseum.org/public/collection/v1.1/search';
const API1  = 'https://collectionapi.metmuseum.org/public/collection/v1/objects/';
const $ = s => document.querySelector(s);

const S = Object.assign(
  { interval: 30, quality: 'original', fit: 'contain', scope: 'all' },
  JSON.parse(localStorage.getItem('met-gallery') || '{}')
);
const save = () => localStorage.setItem('met-gallery', JSON.stringify(S));

let ids = [], idPos = 0, queue = [], loading = false, total = 0, shown = 0;
let history = [];
let cur = null, active = 0, playing = true, elapsed = 0, ready = false, infoLock = false;
let capT1 = 0, capT2 = 0, idleT = 0, toastT = 0, skipRun = 0, pendingNext = false;
let loadingSlide = false, hlNoMedium = false, fetchFails = 0;

window.__errors = [];
addEventListener('error', e => window.__errors.push(e.message || String(e)));
addEventListener('unhandledrejection', e =>
  window.__errors.push('rejection: ' + (e.reason && (e.reason.message || e.reason))));

const slides = [$('#s0'), $('#s1')];
const progressEl = $('#progress i');

const ICONS = {
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"/></svg>'
};

/* ================= utilidades ================= */
const fmt = n => n.toLocaleString('es-AR');
const lStatus = t => { const el = document.getElementById('lStatus'); if (el) el.textContent = t; };

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function mapLimit(arr, n, fn) {
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, arr.length) }, async () => {
    while (i < arr.length) { const j = i++; out[j] = await fn(arr[j]).catch(() => null); }
  }));
  return out;
}

function waitFor(cond, ms) {
  return new Promise((res, rej) => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (cond()) { clearInterval(iv); res(); }
      else if (Date.now() - t0 > ms) { clearInterval(iv); rej(new Error('timeout')); }
    }, 150);
  });
}

const pickImage = o =>
  S.quality === 'web' ? (o.primaryImageSmall || o.primaryImage) : (o.primaryImage || o.primaryImageSmall);

/* traducción best-effort del campo medium (inglés → español) */
const MED = [
  ['oil paint', 'óleo'], ['oil', 'óleo'], ['canvas', 'lienzo'], ['tempera', 'témpera'],
  ['gold', 'oro'], ['silver', 'plata'], ['wood', 'madera'], ['oak', 'roble'],
  ['walnut', 'nogal'], ['poplar', 'álamo'], ['spruce', 'pícea'], ['panel', 'tabla'],
  ['paper', 'papel'], ['copper', 'cobre'], ['ivory', 'marfil'], ['slate', 'pizarra'],
  ['linen', 'lino'], ['silk', 'seda'], ['watercolor', 'acuarela'], ['ink', 'tinta'],
  ['graphite', 'grafito'], ['miniature', 'miniatura'], ['bone', 'hueso'], ['clay', 'arcilla']
];
function traducirMedium(m) {
  if (!m) return '';
  let s = ' ' + m.toLowerCase() + ' ';
  for (const [en, es] of MED) s = s.split(' ' + en + ' ').join(' ' + es + ' ');
  s = s.split(' and ').join(' y ').split(' on ').join(' sobre ').split(' with ').join(' con ');
  s = s.trim().replace(/^./, c => c.toUpperCase());
  return s || m;
}

/* ================= datos ================= */
function searchUrl(offset, limit) {
  let q = API11 + '?departmentId=11&hasImages=true';
  if (!hlNoMedium) q += '&medium=Paintings';
  if (S.scope === 'highlight') q += '&isHighlight=true';
  return q + '&offset=' + offset + '&limit=' + limit;
}

async function fetchIds() {
  hlNoMedium = false;
  let first = await (await fetch(searchUrl(0, 500))).json();
  if ((!first.total || !(first.objectIDs || []).length) && S.scope === 'highlight' && !hlNoMedium) {
    hlNoMedium = true; // reintentar destacadas sin filtro de medio
    first = await (await fetch(searchUrl(0, 500))).json();
  }
  total = first.total || 0;
  const all = (first.objectIDs || []).slice();
  let offset = all.length;
  while (total > 0 && offset < Math.min(total, 10000) && offset < 500 + 10000) {
    const d = await (await fetch(searchUrl(offset, 500))).json();
    const page = d.objectIDs || [];
    if (!page.length) break;
    all.push(...page);
    offset += page.length;
    if (page.length < 500) break;
  }
  ids = shuffle([...new Set(all)]);
  idPos = 0;
  queue = [];
  if (!ids.length) throw new Error('sin resultados');
}

const SKIP_CLASS = new Set(['frames', 'drawings', 'photographs', 'textiles']);

async function refill(size) {
  if (loading || idPos >= ids.length) return;
  loading = true;
  const batch = ids.slice(idPos, idPos + (size || 36));
  idPos += batch.length;
  const objs = await mapLimit(batch, 6, async id => {
    const r = await fetch(API1 + id);
    if (!r.ok) return null;
    const o = await r.json();
    if (!o.primaryImage && !o.primaryImageSmall) return null;
    if (o.classification && SKIP_CLASS.has(o.classification.toLowerCase())) return null;
    return o;
  });
  for (const o of objs) if (o) queue.push(o);
  loading = false;
  lStatus('Colección: ' + fmt(total) + ' obras · ' + queue.length + ' preparadas…');
  if (pendingNext && queue.length) { pendingNext = false; next(); }
  else if (queue.length < 8 && idPos < ids.length) refill();
}

const ensureQueue = () => { if (queue.length < 8) refill(); };

function preloadAhead() {
  for (const o of queue.slice(0, 2)) { const i = new Image(); i.src = pickImage(o); }
}

/* ================= presentación ================= */
function show(o) {
  loadingSlide = true;
  cur = o; shown++;
  const url = pickImage(o);
  const inactive = slides[1 - active];
  const pre = new Image();
  pre.onload = () => {
    loadingSlide = false;
    const el = document.createElement('img');
    el.src = url;
    el.alt = o.title || '';
    el.draggable = false;
    el.className = 'kb' + (Math.random() * 4 | 0);
    el.style.animationDuration = S.interval + 's';
    if (!playing) el.style.animationPlayState = 'paused';
    inactive.innerHTML = '';
    inactive.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      inactive.classList.add('on');
      const old = slides[active];
      slides[active].classList.remove('on');
      active = 1 - active;
      setTimeout(() => { if (!old.classList.contains('on')) old.innerHTML = ''; }, 1800);
    }));
    fillCaption(o);
    elapsed = 0;
    progressEl.style.width = '0%';
    skipRun = 0;
  };
  pre.onerror = () => {
    loadingSlide = false;
    if (++skipRun < 6) next();
    else toast('La imagen no se pudo cargar; probá con otra obra');
  };
  pre.src = url;
}

function fillCaption(o) {
  $('#caption .c-title').textContent = o.title || 'Sin título';
  $('#caption .c-artist').textContent = o.artistDisplayName || o.artistAlphaSort || 'Artista desconocido';
  $('#caption .date').textContent = o.objectDate ? '· ' + o.objectDate : '';
  const med = traducirMedium(o.medium);
  $('#caption .c-sub').textContent = (med ? med + ' · ' : '') + 'The Metropolitan Museum of Art';
  $('#caption .c-link').href = o.objectURL || 'https://www.metmuseum.org';
  captionCycle();
}

function captionCycle() {
  clearTimeout(capT1); clearTimeout(capT2);
  const cap = $('#caption'), scrim = $('#scrim');
  cap.classList.remove('show'); scrim.classList.remove('show');
  if (infoLock) { cap.classList.add('locked'); scrim.classList.add('show'); return; }
  cap.classList.remove('locked');
  capT1 = setTimeout(() => { cap.classList.add('show'); scrim.classList.add('show'); }, 1400);
  capT2 = setTimeout(() => { cap.classList.remove('show'); scrim.classList.remove('show'); }, 11000);
}

function next() {
  if (loadingSlide) return;
  if (!queue.length) {
    if (idPos < ids.length) { pendingNext = true; toast('Cargando más obras…'); refill(); }
    else toast('No hay más obras disponibles');
    return;
  }
  if (cur) history.push(cur);
  if (history.length > 60) history.shift();
  show(queue.shift());
  preloadAhead();
  ensureQueue();
}

function prev() {
  if (loadingSlide) return;
  const o = history.pop();
  if (!o) { toast('Ya estás al principio de la sesión'); return; }
  show(o);
}

/* ================= reloj ================= */
setInterval(() => {
  if (!ready || !playing) return;
  elapsed += 200;
  const p = Math.min(1, elapsed / (S.interval * 1000));
  progressEl.style.width = (p * 100) + '%';
  if (elapsed >= S.interval * 1000) next();
}, 200);

function setPlaying(v) {
  playing = v;
  $('#bPlay').innerHTML = v ? ICONS.pause : ICONS.play;
  $('#bPlay').title = v ? 'Pausar' : 'Reproducir';
  const img = document.querySelector('.slide.on img');
  if (img) img.style.animationPlayState = v ? 'running' : 'paused';
}

/* ================= interfaz ================= */
function poke() {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 3800);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(ev =>
  addEventListener(ev, poke, { passive: true }));

function toggleInfo() {
  infoLock = !infoLock;
  $('#bInfo').classList.toggle('active', infoLock);
  captionCycle();
}

async function toggleFS() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) { toast('Pantalla completa no disponible'); }
}

let wakeLock = null;
async function syncWake() {
  try {
    if ('wakeLock' in navigator && document.fullscreenElement && playing) {
      wakeLock = await navigator.wakeLock.request('screen');
    } else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) { /* no soportado */ }
}
document.addEventListener('fullscreenchange', () => {
  $('#bFull').classList.toggle('active', !!document.fullscreenElement);
  syncWake();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncWake(); });

function bindSeg(id, key, after) {
  const el = $(id);
  el.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === S[key]);
    b.onclick = () => {
      S[key] = b.dataset.v; save();
      el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      after(b.dataset.v);
    };
  });
}

function applySettingsUI() {
  $('#dur').value = S.interval;
  $('#durVal').textContent = S.interval + ' s';
  document.body.classList.toggle('fit-cover', S.fit === 'cover');
  [['#segQ', 'quality'], ['#segF', 'fit'], ['#segS', 'scope']].forEach(([id, k]) => {
    $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === S[k]));
  });
  setPlaying(playing);
}

async function changeScope() {
  toast('Cargando colección…');
  try {
    await fetchIds();
    queue = []; idPos = 0; history = [];
    pendingNext = true;
    refill(12);
  } catch (e) { fetchFails++; toast('No se pudo cambiar la colección'); }
}

/* eventos */
$('#bPrev').onclick = prev;
$('#bNext').onclick = next;
$('#bPlay').onclick = () => setPlaying(!playing);
$('#bInfo').onclick = toggleInfo;
$('#bFull').onclick = toggleFS;
$('#bSettings').onclick = e => { e.stopPropagation(); $('#settings').classList.toggle('open'); };
$('#dur').oninput = e => {
  S.interval = +e.target.value; save();
  $('#durVal').textContent = S.interval + ' s';
  const img = document.querySelector('.slide.on img');
  if (img) img.style.animationDuration = S.interval + 's';
  if (elapsed > S.interval * 1000) elapsed = S.interval * 1000;
};
bindSeg('#segQ', 'quality', () => { preloadAhead(); });
bindSeg('#segF', 'fit', () => { document.body.classList.toggle('fit-cover', S.fit === 'cover'); });
bindSeg('#segS', 'scope', () => { changeScope(); });

document.addEventListener('click', e => {
  if (!e.target.closest('#settings') && !e.target.closest('#bSettings'))
    $('#settings').classList.remove('open');
});
document.addEventListener('dblclick', e => {
  if (!e.target.closest('#controls,#settings,#caption')) toggleFS();
});
addEventListener('keydown', e => {
  const t = e.target;
  if (t && t.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key.toLowerCase() === 'f') toggleFS();
  else if (e.key.toLowerCase() === 'i') toggleInfo();
  else if (e.key === 'Escape') $('#settings').classList.remove('open');
});
document.querySelectorAll('#controls button, .seg button').forEach(b =>
  b.addEventListener('click', () => b.blur()));

/* ================= arranque ================= */
(async function init() {
  applySettingsUI();
  poke();
  try {
    await fetchIds();
    lStatus('Colección: ' + fmt(total) + ' obras · preparando la primera…');
    refill(12);
    await waitFor(() => queue.length >= 1, 90000);
    ready = true;
    next();
    const l = $('#loader');
    l.classList.remove('off');
    setTimeout(() => l.remove(), 1000);
    $('#hint').classList.add('show');
    setTimeout(() => $('#hint').classList.remove('show'), 9000);
  } catch (e) {
    lStatus('No se pudo conectar con la API del Met (' + (e.message || 'red') + '). Revisá tu conexión a internet y recargá la página.');
    const sp = document.querySelector('.l-spin'); if (sp) sp.style.display = 'none';
  }
})();

/* depuración */
window.__met = () => ({
  ready, playing, shown, total, queueLen: queue.length,
  idPos, idsLen: ids.length, fetchFails, errors: window.__errors.slice(0, 5),
  settings: { ...S },
  cur: cur && { title: cur.title, artist: cur.artistDisplayName, date: cur.objectDate, medium: cur.medium, url: pickImage(cur) },
  img: (() => {
    const i = document.querySelector('.slide.on img');
    return i && { w: i.naturalWidth, h: i.naturalHeight, kb: i.className, src: i.src.split('/').slice(-2).join('/') };
  })()
});
</script>
</body>
